name: Auto Sync Characters JSON

on:
  push:
    paths:
      - 'public/img/**'  # 仅在图片文件夹发生变化时触发
  workflow_dispatch:      # 允许手动点击运行

jobs:
  update-json:
    runs-on: ubuntu-latest
    
    # 授予工作流写入仓库的权限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        run: node scripts/update-characters.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update characters.json from image changes"
          file_pattern: 'src/characters.json' # 仅提交更新后的 JSON 文件
          branch: ${{ github.head_ref || github.ref_name }}
